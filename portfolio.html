<body id="top" class="page-portfolio">

    <main id="main-content" class="portfolio-container">
        <h1 class="page-title text-center">PORTFOLIO</h1>

        <div id="portfolio-filters" class="portfolio-filters" role="group" aria-label="Filter projects by category">
            <!-- Filter buttons will be dynamically injected here -->
        </div>

        <div class="portfolio-grid" id="portfolio-grid">
            <!-- Projects will be dynamically injected here -->
        </div>

        <div id="pagination" class="pagination">
            <!-- Page numbers will be injected here -->
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", async () => {
                await window.portfolioReady;
                const escapeHTML = window.PortfolioStore.escape;
                const grid = document.getElementById('portfolio-grid');
                const pagination = document.getElementById('pagination');
                const filtersContainer = document.getElementById('portfolio-filters');
                const itemsPerPage = 9;
                let currentPage = 1;
                let currentCategory = 'All';
                let filteredProjects = [];

                const visibleProjects = (window.PROJECTS || []).filter(project => project.published !== false);
                if (grid && typeof PROJECTS !== 'undefined') {

                    // Filter initialization
                    const categories = ['All', ...new Set(visibleProjects.map(project => project.category).filter(Boolean))];
                    const requestedCategory = new URLSearchParams(location.search).get('category');
                    if (categories.includes(requestedCategory)) currentCategory = requestedCategory;

                    function renderFilters() {
                        if (filtersContainer && categories.length > 1) {
                            filtersContainer.innerHTML = '';
                            categories.forEach(category => {
                                const btn = document.createElement('button');
                                btn.className = `filter-btn ${category === currentCategory ? 'active' : ''}`;
                                btn.innerText = category;
                                btn.type = 'button';
                                btn.dataset.category = category;
                                btn.setAttribute('aria-pressed', String(category === currentCategory));
                                btn.addEventListener('click', () => {
                                    currentCategory = category;
                                    currentPage = 1; // Reset to first page
                                    filtersContainer.querySelectorAll('button').forEach(button => {
                                        const active = button.dataset.category === currentCategory;
                                        button.classList.toggle('active', active);
                                        button.setAttribute('aria-pressed', String(active));
                                    });
                                    const url = new URL(location.href);
                                    if (currentCategory === 'All') url.searchParams.delete('category');
                                    else url.searchParams.set('category', currentCategory);
                                    try { history.pushState(null, '', url); } catch (_) {}
                                    updateFilteredProjects();
                                });
                                filtersContainer.appendChild(btn);
                            });
                        }
                    }

                    function updateFilteredProjects() {
                        if (currentCategory === 'All') {
                            filteredProjects = visibleProjects;
                        } else {
                            // Using includes on toUpperCase for flexible matching
                            filteredProjects = visibleProjects.filter(p =>
                                p.category === currentCategory
                            );
                        }
                        renderProjects(currentPage);
                        renderPagination();
                    }

                    function renderProjects(page) {
                        grid.innerHTML = '';
                        const start = (page - 1) * itemsPerPage;
                        const end = start + itemsPerPage;
                        const paginatedItems = filteredProjects.slice(start, end);

                        paginatedItems.forEach(project => {
                            const card = document.createElement('a');
                            card.href = `project-detail.html?id=${encodeURIComponent(project.id)}`;
                            card.className = 'project-card';

                            card.innerHTML = `
                                <div class="card-image-wrapper">
                                    <div class="card-image" style="background-image: url('${project.thumbnail}'); background-position: ${window.PortfolioStore.coverPosition(project.thumbnailPosition).x}% ${window.PortfolioStore.coverPosition(project.thumbnailPosition).y}%;"></div>
                                    <div class="card-title-overlay">
                                        <h3>${escapeHTML(project.title)}</h3>
                                        ${project.contributions && project.contributions.length > 0 ? `
                                            <p class="card-roles">${project.contributions.slice(0, 3).map(escapeHTML).join(' | ')}</p>
                                        ` : ''}
                                    </div>
                                </div>
                                <div class="card-content">
                                    ${project.tags && project.tags.length > 0 ? `
                                        <div class="card-tags">
                                            ${project.tags.map(tag => `<span class="tag tag-${tag.toLowerCase().replace(/[^a-z0-9]/g, '')}">${escapeHTML(tag)}</span>`).join('')}
                                        </div>
                                    ` : ''}
                                    ${project.thumbnailDescription ? `<p class="card-description">${escapeHTML(project.thumbnailDescription)}</p>` : ''}
                                    ${project.contributions && project.contributions.length > 0 ? `
                                        <div class="card-contributions">
                                            <h4 class="contributions-title">My contributions:</h4>
                                            <ul class="contributions-list">
                                                ${[...new Set(project.contributions)].map(c => `<li><i class="fas fa-check"></i> ${escapeHTML(c)}</li>`).join('')}
                                            </ul>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                            grid.appendChild(card);
                        });

                        let status = document.getElementById('project-count');
                        if (!status) {
                            status = document.createElement('p');
                            status.id = 'project-count';
                            status.className = 'text-center project-count';
                            status.setAttribute('role', 'status');
                            status.setAttribute('aria-live', 'polite');
                            filtersContainer.after(status);
                        }
                        status.textContent = `${filteredProjects.length} ${filteredProjects.length === 1 ? 'project' : 'projects'}`;
                        if (!filteredProjects.length) {
                            const message = document.createElement('p');
                            message.className = 'text-center';
                            message.textContent = 'No projects in this category. Choose All to browse the portfolio.';
                            grid.appendChild(message);
                        }
                        // Scroll to top of grid when page changes (only if it wasn't the first load)
                        if (page !== 1 || (pagination.innerHTML !== '' && pagination.children.length > 1)) {
                            const targetTop = filtersContainer ? filtersContainer.offsetTop - 120 : grid.offsetTop - 100;
                            window.scrollTo({ top: targetTop, behavior: 'smooth' });
                        }
                    }

                    function renderPagination() {
                        pagination.innerHTML = '';
                        const totalPages = Math.ceil(filteredProjects.length / itemsPerPage);

                        if (totalPages <= 1) return;

                        for (let i = 1; i <= totalPages; i++) {
                            const btn = document.createElement('button');
                            btn.innerText = i;
                            btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                            btn.addEventListener('click', () => {
                                currentPage = i;
                                renderProjects(currentPage);
                                renderPagination();
                            });
                            pagination.appendChild(btn);
                        }
                    }

                    window.addEventListener('popstate', () => {
                        const category = new URLSearchParams(location.search).get('category') || 'All';
                        currentCategory = categories.includes(category) ? category : 'All';
                        currentPage = 1;
                        filtersContainer.querySelectorAll('button').forEach(button => {
                            const active = button.dataset.category === currentCategory;
                            button.classList.toggle('active', active);
                            button.setAttribute('aria-pressed', String(active));
                        });
                        updateFilteredProjects();
                    });
                    renderFilters();
                    updateFilteredProjects();
                }
            });
        </script>
