<head>

<body id="top" class="page-project-detail">

    <nav aria-label="Main navigation" id="navbar" class="dark-bg">

            <a href="index.html"><img src="images/LOGO.png" alt="Yekta Demirci Logo"></a>
        </div>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="portfolio.html" class="active" aria-current="page">PORTFOLIO</a></li>
            <li><a href="resume.html">RESUME</a></li>
            <li><a href="featured.html">FEATURED</a></li>
            <li><a href="index.html#contact">CONTACT</a></li>
        </ul>
    </nav>

    <!-- Dynamic Project Hero -->
    <header class="project-hero" id="project-hero">
        <div class="hero-image-placeholder" id="hero-banner">
            <!-- Dynamic banner (image or PDF) will be injected here -->
        </div>
    </header>

    <main id="main-content" class="project-container">
        <!-- Return Link -->
        <div class="return-nav fade-in-section">
            <a href="portfolio.html" class="return-link">
                <span class="arrow">&lt;</span> RETURN
            </a>
        </div>

        <!-- Project Header and Metadata -->
        <div class="project-header text-center fade-in-section" id="page-project-title-container">
            <h1 class="project-title" id="page-project-title">Project Title</h1>
            <p class="project-metadata italic" id="page-project-metadata">
                Metadata
            </p>
        </div>

        <!-- Dynamic Content Column -->
        <article class="project-content" id="project-content-area">
            <p class="intro-text fade-in-section" id="page-project-intro">
                Intro text...
            </p>

            <div id="dynamic-sections">
                <!-- Project sections will be injected here -->
            </div>
        </article>

        <!-- Next Project Navigation Placeholder -->
        <div id="next-project-anchor"></div>

        <!-- Dot Navigation Sidebar (Vertical) -->
        <nav class="dot-nav" id="sidebar-dots">
            <ul id="dots-list">
                <!-- Dynamic dots will be injected here -->
            </ul>
        </nav>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
                await window.portfolioReady;
                const escapeHTML = window.PortfolioStore.escape;
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (projectId && typeof PROJECTS !== 'undefined') {
                const projectIndex = PROJECTS.findIndex(p => p.id === projectId && p.published !== false);
                const project = PROJECTS[projectIndex];

                if (project) {
                    // 1. Update Title and Metadata
                    document.title = `${project.title.toUpperCase()} | Yekta Demirci`;
                    document.getElementById('page-project-title').textContent = project.title;
                    document.getElementById('page-project-metadata').textContent = project.metadata;
                    document.getElementById('page-project-intro').innerHTML = project.intro;
                    if (project.facts && project.facts.length) {
                        const facts = document.createElement('p');
                        facts.className = 'intro-text project-facts';
                        project.facts.forEach((item, index) => {
                            if (index) facts.appendChild(document.createElement('br'));
                            const label = document.createElement('strong'); label.textContent = `${item.label}: `;
                            facts.append(label, document.createTextNode(item.value));
                        });
                        document.getElementById('page-project-intro').after(facts);
                    }
                    // const contentArea = document.getElementById('project-content-area'); // This line was removed in the provided diff, but it's not explicitly part of the instruction. Keeping it for now.

                    const canonical = document.querySelector('link[rel="canonical"]');
                    canonical.href = `https://www.yektademirci.com/project-detail.html?id=${encodeURIComponent(project.id)}`;
                    document.querySelector('meta[name="description"]').content = project.thumbnailDescription || project.title;
                    document.querySelector('meta[property="og:title"]').content = project.title;
                    document.querySelector('meta[property="og:description"]').content = project.thumbnailDescription || project.title;
                    if (project.links && project.links.length) {
                        const links = document.createElement('p');
                        links.className = 'intro-text project-resource-links';
                        project.links.forEach((item, index) => {
                            if (index) links.appendChild(document.createTextNode(' · '));
                            const link = document.createElement('a');
                            link.href = item.href;
                            link.textContent = item.label;
                            if (item.href.startsWith('https://')) { link.target = '_blank'; link.rel = 'noopener noreferrer'; }
                            links.appendChild(link);
                        });
                        document.getElementById('page-project-intro').after(links);
                    }
                    // 2. Handle Banner (Top Background)
                    const bannerContainer = document.getElementById('hero-banner');
                    if (project.bannerType === 'pdf') {
                        // Use PDF container setup
                        bannerContainer.innerHTML = `
                            <div id="pdf-canvas-container" class="pdf-wrapper" data-pdf-url="${project.bannerSrc}"></div>
                            <button type="button" aria-label="Previous PDF page" id="prev-page" class="pdf-nav-btn prev"><i class="fas fa-chevron-left"></i></button>
                            <button type="button" aria-label="Next PDF page" id="next-page" class="pdf-nav-btn next"><i class="fas fa-chevron-right"></i></button>
                            <div id="page-num-display" class="page-indicator">
                                <span id="page-num">1</span> / <span id="page-count">0</span>
                            </div>
                        `;
                        window.PDF_SRC = project.bannerSrc;
                    } else if (project.bannerType === 'video') {
                        bannerContainer.innerHTML = `
                            <div style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background-color: var(--bg-color-dark);">
                                <iframe title="${escapeHTML(project.title)} gameplay video" referrerpolicy="strict-origin-when-cross-origin" src="${project.bannerSrc}"
                                    style="aspect-ratio: 16 / 9; height: 100%; max-width: 100%; border: none;"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                    allowfullscreen>
                                </iframe>
                            </div>
                        `;
                        bannerContainer.style.backgroundColor = 'var(--bg-color-dark)';
                    } else if (project.bannerSrc) {
                        bannerContainer.style.backgroundImage = `url('${project.bannerSrc}')`;
                    } else {
                        bannerContainer.style.backgroundColor = 'var(--bg-color-dark)';
                    }

                    // 3. Helper to render media blocks (Images, Videos, PDFs, Groups)
                    function renderMediaBlock(media) {
                        if (!media) return '';
                        if (media.type === 'media-board') return window.CanvasBoard.render(media);
                        const place = html => {
                            if (!media.layout) return html;
                            const layout = window.PortfolioStore.mediaLayout(media.layout);
                            return `<div class="media-placement" style="padding-top:${layout.top}px"><div class="media-layout${layout.ratio ? ' has-ratio' : ''}" style="width:${layout.width}%;margin-left:${layout.x}%;${layout.ratio ? `--media-ratio:${layout.ratio};` : ''}">${html}</div></div>`;
                        };
                        const caption = media.caption ? `<p class="media-caption">${media.caption}</p>` : '';
                        if (media.type === 'image' || media.type === 'gif') {
                            const crop = window.PortfolioStore.mediaLayout(media.layout);
                            return place(`<div class="media-block fade-in-section"><div class="image-crop"><img style="transform:scale(${crop.zoom});transform-origin:${crop.cropX}% ${crop.cropY}%" src="${media.src}" alt="${media.caption || escapeHTML(project.title)}" loading="lazy" decoding="async"></div>${caption}</div>`);
                        } else if (media.type === 'video') {
                            const videoHTML = media.provider === 'youtube' ?
                                `<iframe title="${media.caption || escapeHTML(project.title)} video" src="${media.src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>` :
                                `<video controls playsinline preload="metadata" src="${media.src}"></video>`;
                            return place(`<div class="media-block fade-in-section"><div class="video-wrapper">${videoHTML}</div>${caption}</div>`);
                        } else if (media.type === 'pdf') {
                            return place(`<div class="media-block pdf-block fade-in-section"><embed src="${media.src}" type="application/pdf"></div>`);
                        } else if (media.type === 'media-group') {
                            // If the group only has 1 item, render it as a standalone block so it spans full width
                            if (media.items && media.items.length === 1) {
                                return renderMediaBlock(media.items[0]);
                            }
                            const columns = Number(media.columns) === 3 ? 3 : 2;
                            let groupHTML = `<div class="media-grid fade-in-section" style="--media-columns:${columns}">`;
                            (media.items || []).forEach(item => groupHTML += renderMediaBlock(item));
                            groupHTML += `</div>`;
                            return groupHTML;
                        }
                        return '';
                    }

                    // 4. Inject Main Media (under intro)
                    if (project.mainMedia) {
                        const mainMediaEl = document.createElement('div');
                        mainMediaEl.innerHTML = renderMediaBlock(project.mainMedia);
                        document.getElementById('page-project-intro').after(mainMediaEl);
                    }

                    // 5. Inject Sections and Dots
                    const sectionsContainer = document.getElementById('dynamic-sections');
                    const dotsList = document.getElementById('dots-list');

                    // Add Hero and Intro Dots
                    dotsList.innerHTML += `<li><a href="#top" title="Top"><span class="dot"></span></a></li>`;
                    dotsList.innerHTML += `<li><a href="#page-project-title-container" title="Introduction"><span class="dot"></span></a></li>`;

                    project.sections.forEach(section => {
                        // Section Injection
                        const sectionEl = document.createElement('section');
                        sectionEl.className = 'content-block fade-in-section';
                        sectionEl.id = section.id;

                        let sectionHTML = `<h2>${section.title}</h2>`;

                        // Support for new 'blocks' array
                        if (section.blocks) {
                            section.blocks.forEach(block => {
                                if (block.type === 'text') {
                                    sectionHTML += `<p class="text-block">${block.value}</p>`;
                                } else {
                                    sectionHTML += renderMediaBlock(block);
                                }
                            });
                        }
                        // Backward compatibility for old 'content' field
                        else if (section.content) {
                            sectionHTML += `<p>${section.content}</p>`;
                        }

                        sectionEl.innerHTML = sectionHTML;
                        sectionsContainer.appendChild(sectionEl);

                        // Dot Injection
                        const dotLi = document.createElement('li');
                        dotLi.innerHTML = `<a href="#${section.id}" title="${section.title}"><span class="dot"></span></a>`;
                        dotsList.appendChild(dotLi);
                    });

                    // 6. Next Project Navigation
                    if (PROJECTS.length > 1) {
                        const visibleProjects = PROJECTS.filter(item => item.published !== false);
                        const nextIndex = (visibleProjects.indexOf(project) + 1) % visibleProjects.length;
                        const nextProject = visibleProjects[nextIndex];
                        const nextNav = document.getElementById('next-project-anchor');

                        nextNav.innerHTML = `
                            <div class="next-project-nav fade-in-section" id="next-project-section">
                                <span class="next-label">NEXT PROJECT</span>
                                <a href="project-detail.html?id=${encodeURIComponent(nextProject.id)}" class="next-project-link">
                                    <div class="next-project-card">
                                        <div class="next-img" style="background-image: url('${nextProject.thumbnail}');"></div>
                                        <div class="next-project-overlay">
                                            <h2 class="next-project-title uppercase">${escapeHTML(nextProject.title)} <span class="next-arrow">→</span></h2>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        `;

                        // Add Next Project Dot
                        dotsList.innerHTML += `<li><a href="#next-project-section" title="Next Project"><span class="dot"></span></a></li>`;
                    }

                    // 6. Final Initialization for dynamic elements
                    if (window.initFadeAnimations) window.initFadeAnimations();
                    if (window.initDotNav) window.initDotNav();
                }
            }
            if (!projectId || !window.PROJECTS || !window.PROJECTS.some(item => item.id === projectId && item.published !== false)) {
                document.querySelector('.project-hero').hidden = true;
                document.getElementById('sidebar-dots').hidden = true;
                document.getElementById('page-project-title').textContent = projectId ? 'Project unavailable' : 'Choose a project';
                document.getElementById('page-project-metadata').textContent = '';
                document.getElementById('page-project-intro').textContent = 'Explore the current portfolio for published projects and work samples.';
                document.title = 'Portfolio | Yekta Demirci';
                const robots = document.createElement('meta');
                robots.name = 'robots';
                robots.content = 'noindex, follow';
                document.head.appendChild(robots);
                document.querySelector('link[rel="canonical"]').remove();
            }
        });
    </script>
